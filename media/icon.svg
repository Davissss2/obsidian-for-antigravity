<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Obsidian Crystal Facets -->
  <polygon points="12,2 18,7 15,22 12,18 9,22 6,7" fill="url(#purpleGrad)" opacity="0.85" filter="url(#glow)"/>
  <polygon points="12,2 18,7 12,18" fill="#A855F7" opacity="0.6" />
  <polygon points="12,2 9,22 12,18" fill="#6366F1" opacity="0.7" />
  <!-- Brain / Neural Nodes -->
  <circle cx="12" cy="7" r="1.5" fill="#FFFFFF" />
  <circle cx="8" cy="12" r="1.3" fill="#67E8F9" />
  <circle cx="16" cy="12" r="1.3" fill="#67E8F9" />
  <circle cx="12" cy="15" r="1.5" fill="#F472B6" />
  <!-- Neural Link Lines -->
  <line x1="12" y1="7" x2="8" y2="12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />
  <line x1="12" y1="7" x2="16" y2="12" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />
  <line x1="8" y1="12" x2="12" y2="15" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />
  <line x1="16" y1="12" x2="12" y2="15" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9" />
</svg>
